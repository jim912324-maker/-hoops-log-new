<h1>命中率怎麼看</h1>
<p class="lead">命中率等於進球數除以出手數，用來判斷自己的出手選擇好不好。</p>
<h2>運作方式</h2>
<p>投籃命中率看全部兩分與三分，三分命中率只看三分球，罰球命中率只看罰球。記錄時寫成「命中/出手」，例如 5/11，要看百分比再換算。樣本太少時，一場的百分比參考價值有限，累積多場更準。</p>
<h2>常見錯誤</h2>
<p>只看得分不看出手數。同樣 12 分，5/11 和 5/20 的意義完全不同。</p>
