<h1>對上高個子怎麼打</h1>
<p class="lead">對方比你高大時，硬攻籃框容易被蓋火鍋，改用空檔與外線拉開他們。</p>
<h2>運作方式</h2>
<p>高個子的優勢在禁區，所以進攻方向要避開他們的手。先把球傳給有空檔的隊友，讓防守者跟著球移動，禁區就會出現縫隙。外線出手也能逼高個子離開籃下，這時再用運球切入或傳球，成功率會比硬衝高。</p>
<h2>常見錯誤</h2>
<p>每次拿到球都直接殺進去，結果被封阻或被擠出平衡。另一個錯誤是外線沒有信心，不敢出手，對方就可以安心守在籃下。</p>
