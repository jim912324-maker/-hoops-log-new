<h1>擋拆（Pick and Roll）</h1>
<p class="lead">一個人替持球者擋住防守者，然後轉身切入，製造二打一的機會。</p>
<h2>運作方式</h2>
<p>擋人者站在持球者防守人的路徑上，持球者貼著擋人者運球通過。這時防守方要決定誰去防誰，只要有一瞬間的猶豫，持球者可以自己攻擊，擋人者也可以轉身空切，接傳球上籃。</p>
<h2>常見錯誤</h2>
<p>擋人者沒站穩就移動，會被判違例或帶球撞人。持球者太早出手，沒有讀防守反應，擋拆就只是多跑一趟。</p>
